# Darbaan configuration (YAML).
#
# Precedence, low to high: this file < DARBAAN_* environment < command-line flags.
# Default search path is /etc/darbaan/config.yaml; override with --config PATH.
# Every key below has a matching --flag and a DARBAAN_<KEY> env var
# (uppercased, '-' -> '_'), e.g. listener-addr -> --listener-addr / DARBAAN_LISTENER_ADDR.

# Message store (the sluice / outbound hold-queue). Backend is config-selected;
# v1 ships bbolt.
store-type: bbolt
sluice-db: darbaan.db

# Audit log: a separate, optional store. "bbolt" is the hash-chained,
# tamper-evident log (on by default); "null" turns auditing off for a simple
# deployment. Audit is best-effort, written after the message-store commit.
audit-type: bbolt
audit-db: darbaan-audit.db

# Inbound store: the agent's served mailbox, holding Darbaan-generated messages
# (v1: MAILER-DAEMON bounces on reject) that the IMAP face serves. Separate from
# the sluice — a bounce is read by the agent, not an outbound send.
inbound-type: bbolt
inbound-db: darbaan-inbound.db

# DKIM signing of bounces (ADR 0007). Every Darbaan-issued bounce is signed so
# the agent, holding only the pinned public key, trusts only bounces Darbaan
# produced. The key is a PEM-encoded ed25519 private key FILE (PKCS#8); only its
# path is config — the file is the secret (ADR 0012), never inlined here.
# Required for the reject/bounce path (fail-closed). Generate with:
#   openssl genpkey -algorithm ed25519 -out dkim.pem
# Publish/pin the public record from: darbaan dkim-pubkey
dkim-key-file: ""            # path to the ed25519 private key (PEM)
dkim-selector: darbaan
dkim-domain: ""              # signing domain (d=); typically the listener domain

# Upstream Sender — the only component that delivers approved mail off the box.
# DEFAULT is "stub": nothing sends, default-deny stays structural (ADR 0003).
# Setting sender-type=smtp is the DELIBERATE flip — it makes a fully-approved
# message actually deliver. Only ever reached after the approval pipeline; no
# path sends without approval. The app password is supplied via
# DARBAAN_SMTP_PASSWORD (a Gmail app password, account 2FA), never inlined here
# and never logged (ADR 0012). Real credentials live only in Darbaan (ADR 0002).
sender-type: stub                  # stub | smtp
smtp-host: "smtp.gmail.com:587"    # host:port (STARTTLS, cert verified)
smtp-username: ""                  # e.g. you@gmail.com

# SMTP submission face.
listener-addr: ":1465"
listener-domain: localhost
listener-tls-cert: ""          # path to the TLS certificate (PEM)
listener-tls-key: ""           # path to the TLS private key (PEM)
listener-allow-insecure: false # permit AUTH over plaintext — local testing only

# IMAP read face: the agent reads its Darbaan-generated messages (bounces) from
# the inbound store over standard IMAP. One service hosts both faces (ADR 0001);
# the IMAP face reuses the agent credential and the listener TLS above.
imap-addr: ":1143"

# Operator admin API. The running serve owns the bbolt stores (single-writer),
# so `darbaan queue ls|show|approve|reject` connect HERE as thin clients rather
# than opening the DB. Bind loopback-only (or keep container-internal in Docker);
# never expose it to the agent. The bearer token comes from DARBAAN_ADMIN_TOKEN
# (required — serve fails closed without it), never inlined here.
admin-addr: "127.0.0.1:1144"

# --- Per-client scoped admin tokens (optional; ADR 0029) ---------------------
# By default DARBAAN_ADMIN_TOKEN is a single full-capability token every admin
# interface shares. To give each interface its own least-privilege, independently
# revocable credential, list them under `admin_clients:`. Each client's token
# comes from DARBAAN_ADMIN_TOKEN_<NAME> (name uppercased, non-alphanumerics ->
# '_'), never inlined (ADR 0012). Scopes are per route, least-privilege:
#   queue:read / queue:decide, holds:read / holds:decide,
#   reconcile:read / reconcile:release, inboxes:read.
# Revoke one client by unsetting its token env and restarting; the others are
# unaffected. A client whose token env is unset is skipped with a startup warning.
#
# DARBAAN_ADMIN_TOKEN stays the full-scope ROOT (break-glass) — and it is the
# credential the `darbaan queue|holds|reconcile` CLI uses by default, so no config
# change is needed to keep the CLI working. Put the CLI on its own revocable
# credential only if you want to: add a named client granted every scope and point
# the CLI's DARBAAN_ADMIN_TOKEN at that token instead of the root.
#
# admin_clients:
#   - name: telegram        # the approval bot: decide on mail + read the latch alert (#149)
#     scopes: [queue:read, queue:decide, holds:read, holds:decide, reconcile:read]
#     # token from DARBAAN_ADMIN_TOKEN_TELEGRAM
#   - name: pre-screener    # read-only: inspects but never decides
#     scopes: [queue:read, holds:read]
#     # token from DARBAAN_ADMIN_TOKEN_PRE_SCREENER

# The agent's Darbaan SMTP username. The password is NOT configured here: it is
# supplied out-of-band via DARBAAN_AGENT_PASS, a reference to the encrypted
# store (ADR 0012). Secrets are never inlined in config.
agent-username: ""

# Approval chains: ordered approver names. v1 ships the manual (human) approver.
approval-strict: [manual]
approval-light: [manual]

# Incoming-message injection assessment (ADR 0032, Amendment 1). OFF by default.
# When enabled, each incoming message is assessed for prompt-injection risk
# EAGERLY at ingest — the sync fetches and assesses the body before the message
# is ever exposed to the agent, so a held message is decided before its first
# read (no first-read window). A high-risk message is HELD for the operator in
# the hold-for-human queue (`darbaan holds ls|expose|drop`), where the operator
# sees its reason and fenced body to judge Expose vs Drop; a low/medium message
# flows to the agent normally.
#
# What the agent sees on the read face is a read of the decided state: an
# UNDECIDED hold is invisible, an EXPOSED (approved) one is the real message, and
# a REJECTED one is a system tombstone (never the original attacker-controlled
# bytes). Enabling assessment changes how inbound mail is dispositioned on a
# running inbox, so it is a deliberate opt-in. The detector and scorer are
# constructed and alignment-checked at startup even when disabled, so a
# misconfiguration fails startup rather than lurking behind the flag; disabled is
# a clean no-op (headers-only lazy sync, no assessment, no new holds). On an
# assessor timeout or an unassessable body the message is held (fail-safe).
assessment-enabled: false
assessment-timeout: 5s

# Once assessment is enabled, an OPTIONAL `assessment:` section tunes the
# deterministic scorer's weights, bands, and human-surface threshold (ADR 0032
# §7). Every key is overlaid onto the built-in defaults, so a partial section is
# valid — unspecified keys keep their default — and omitting the section entirely
# leaves the defaults unchanged. A composed score at or above `threshold` is held
# for a human. An invalid section (e.g. band cutoffs out of order) fails startup
# rather than scoring wrong. Below are the defaults, shown for reference:
#
# assessment:
#   # Baseline points by the trust the gate stamped on the source (ADR 0030/0031),
#   # never a re-read of From. The "unknown" floor is required.
#   sender_baselines:
#     trusted: 0
#     untrusted: 40
#     unknown: 30
#   # Point adjustment by the mailbox's recipient position; an unlisted position
#   # adds nothing. An identity-less inbox (no address to match) adds nothing.
#   recipient_adjust:
#     to: 0
#     cc: 5
#     bcc: 10
#   # Per-factor contribution when a content factor is flagged; the table is
#   # authoritative, so a flagged factor with no entry adds nothing.
#   factor_points:
#     instruction_to_reader: 40
#     secrets_request: 40
#     hidden_directives: 30
#     attachment_directives: 30
#   # Labeled-band cutoffs over the 0-100 score: below low_max is low, below
#   # medium_max is medium, at or above medium_max is high.
#   bands:
#     low_max: 33
#     medium_max: 66
#   # Human-surface cutoff: a composed score >= threshold is held. Lower it for a
#   # more conservative posture.
#   threshold: 70

# --- Multi-inbox + multi-agent (optional; ADR 0023 / ADR 0027) ---------------
# The flat fields above define ONE inbox and ONE implicit agent. To front several
# inboxes and/or several agent principals, add `inboxes:` and `agents:` lists.
# Both are opt-in; omitting them keeps the single-agent behaviour above unchanged.
#
# Each inbox is a named mailbox with its own backend, send identity, and filter
# (ADR 0023). Each agent is a login with a per-inbox grant list — {read, send}
# per inbox — and its password comes from DARBAAN_AGENT_<NAME>_PASSWORD (name
# uppercased, non-alphanumerics -> '_'), never inlined (ADR 0012). Sharing an
# inbox = listing it under more than one agent; an inbox an agent is not granted
# is invisible to it (privacy by omission). default_inbox is the inbox that agent
# sees as IMAP INBOX and the target of its send catch-all; it must be a granted
# inbox with read access. An agent name may not equal an inbox name.
#
# On-demand sync (ADR 0028, opt-in per inbox): when sync_on_status is set, an IMAP
# STATUS for that inbox triggers an immediate upstream pull before the counts are
# returned, so an agent can "sync now" instead of waiting out the background poll
# (inbound-imap-poll-interval). It is debounced per inbox — sync_on_status_interval
# is the minimum gap between on-demand pulls (default 60s); a STATUS inside the
# window silently reports current counts without dialing. NOOP/CHECK never trigger
# a pull. Ignored for an inbox with no upstream.
#
# inboxes:
#   - name: inbox-a
#     identity: a@inbox-a.example      # the From/envelope Darbaan sends as
#     backend: { imap_host: "imap.example:993", imap_username: "a@inbox-a.example" }
#     sync_on_status: true             # STATUS pulls upstream now (ADR 0028)
#     sync_on_status_interval: "60s"   # debounce window (default 60s)
#   - name: inbox-b
#     identity: b@inbox-b.example
#     backend: { imap_host: "imap.example:993", imap_username: "b@inbox-b.example" }
#
# agents:
#   - name: agent-a
#     # password from DARBAAN_AGENT_AGENT_A_PASSWORD
#     default_inbox: inbox-a
#     grants:
#       - { inbox: inbox-a, access: [read, send] }
#       - { inbox: inbox-b, access: [read] }       # read-only on the shared inbox
#   - name: agent-b
#     # password from DARBAAN_AGENT_AGENT_B_PASSWORD
#     default_inbox: inbox-b
#     grants:
#       - { inbox: inbox-b, access: [read, send] }
