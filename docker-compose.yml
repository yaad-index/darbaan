# Ready-to-run Darbaan.
#
#   1. cp .env.example .env   and fill DARBAAN_AGENT_PASS
#   2. put TLS cert+key in ./secrets/tls/ and an ed25519 DKIM key in ./secrets/dkim/
#   3. docker compose up -d
#
# Safe by default: sender-type=stub, so the container sends NOTHING until you set
# DARBAAN_SENDER_TYPE=smtp + DARBAAN_SMTP_PASSWORD (a Gmail app password). Ports
# bind to 127.0.0.1 only — Darbaan is a local-trusted-host service, not
# internet-facing (ADR 0012). Secrets come from .env / mounts, never the image.

services:
  darbaan:
    build: .
    # image: ghcr.io/yaad-index/darbaan:latest   # once a published image exists
    restart: unless-stopped
    ports:
      # Only the agent faces are published. The admin API (127.0.0.1:1144) is
      # deliberately NOT here — it stays container-internal, reached only via
      # `docker exec darbaan darbaan queue ...`, never from the host or the agent.
      - "127.0.0.1:1465:1465"   # SMTP submission (agent -> Darbaan)
      - "127.0.0.1:1143:1143"   # IMAP read (agent reads its bounces)
    environment:
      # Agent credential. Username here, password from .env.
      DARBAAN_AGENT_USERNAME: "agent"
      DARBAAN_AGENT_PASS: "${DARBAAN_AGENT_PASS:?set DARBAAN_AGENT_PASS in .env}"

      # Operator admin API token (required). Inherited by `docker exec` so the
      # queue commands authenticate automatically.
      DARBAAN_ADMIN_TOKEN: "${DARBAAN_ADMIN_TOKEN:?set DARBAAN_ADMIN_TOKEN in .env}"

      # TLS — secure by default. Mount your cert + key (see volumes) and the
      # agent connects over TLS (ADR 0002).
      DARBAAN_LISTENER_TLS_CERT: /run/secrets/tls/cert.pem
      DARBAAN_LISTENER_TLS_KEY: /run/secrets/tls/key.pem
      # For a localhost-only first run WITHOUT certs, comment the two lines above
      # and uncomment this (plaintext AUTH — localhost only, never in production):
      # DARBAAN_LISTENER_ALLOW_INSECURE: "true"

      # Bounce signing (ADR 0007): mount the ed25519 key, set selector + domain.
      DARBAAN_DKIM_KEY_FILE: /run/secrets/dkim/dkim.pem
      DARBAAN_DKIM_SELECTOR: "darbaan"
      DARBAAN_DKIM_DOMAIN: "darbaan.example"

      # Upstream Sender — DEFAULT stub (sends nothing). The deliberate flip:
      # set sender-type=smtp + the username, and DARBAAN_SMTP_PASSWORD in .env.
      DARBAAN_SENDER_TYPE: "stub" # change to "smtp" to actually deliver
      DARBAAN_SMTP_HOST: "smtp.gmail.com:587"
      DARBAAN_SMTP_USERNAME: "" # e.g. you@gmail.com (when sender-type=smtp)
      DARBAAN_SMTP_PASSWORD: "${DARBAAN_SMTP_PASSWORD:-}"

      # Inbound mailbox sync (ADR 0019) — OFF by default (no host = disabled).
      # WARNING (v1, no filter): everything synced is fully readable by the agent
      # — point it at a non-sensitive / test mailbox until the filter lands.
      # Uncomment + set the host/username to enable; password from .env.
      # DARBAAN_INBOUND_IMAP_HOST: "imap.gmail.com:993"
      # DARBAAN_INBOUND_IMAP_USERNAME: "" # e.g. you@gmail.com
      # DARBAAN_INBOUND_IMAP_MAILBOX: "INBOX"
      # Recency cutoff for the first/full sync (ADR 0008): only mail newer than
      # this is pulled, e.g. 1y / 30d / 12h. Empty = no cutoff (pull everything).
      # Forward-only: widening it later needs a re-sync (old UIDs are behind the
      # cursor). Bounds both the store and the first pull on a deep mailbox.
      # DARBAAN_INBOUND_MAX_AGE: "1y"
      # Inbound filter rules (ADR 0021): serve-time allow/hide over synced mail.
      # Mount a YAML rules file and point at it; empty = no filter (allow all).
      # DARBAAN_INBOUND_FILTER: /etc/darbaan/inbound-filter.yaml
      DARBAAN_INBOUND_IMAP_PASSWORD: "${DARBAAN_INBOUND_IMAP_PASSWORD:-}"
    volumes:
      - darbaan-data:/data # the three bbolt DBs (sluice / audit / inbound)
      - ./secrets/tls:/run/secrets/tls:ro # you provide cert.pem + key.pem
      - ./secrets/dkim:/run/secrets/dkim:ro # you provide dkim.pem (ed25519)
      # - ./config.yaml:/etc/darbaan/config.yaml:ro   # optional mounted config

  # Telegram approval client — a separate process (ADR 0017), a client of the
  # admin API, NOT part of serve. It shares darbaan's network namespace
  # (network_mode: service:darbaan) so it reaches the admin API on loopback
  # (127.0.0.1:1144) and has outbound egress to Telegram; it never touches the
  # stores directly and holds no mail credentials (ADR 0002). It is stateless —
  # the posted/pending sets are in-memory by design — so it has no volume.
  darbaan-telegram:
    build: .
    # image: ghcr.io/yaad-index/darbaan:latest   # once a published image exists
    command: telegram
    restart: unless-stopped
    depends_on:
      - darbaan
    network_mode: "service:darbaan"
    environment:
      DARBAAN_TELEGRAM_TOKEN: "${DARBAAN_TELEGRAM_TOKEN:?set DARBAAN_TELEGRAM_TOKEN in .env}"
      DARBAAN_TELEGRAM_OPERATOR_ID: "${DARBAAN_TELEGRAM_OPERATOR_ID:?set DARBAAN_TELEGRAM_OPERATOR_ID in .env}"
      # Same admin token as darbaan — this is the client side of the admin API.
      DARBAAN_ADMIN_TOKEN: "${DARBAAN_ADMIN_TOKEN:?set DARBAAN_ADMIN_TOKEN in .env}"

volumes:
  darbaan-data:
